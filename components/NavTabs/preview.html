<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>NavTabs</title>
<style>
  body { padding: 16px; padding: 16px 0; }

</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.AR4, h = React.createElement, useState = React.useState;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ar-stack', style: { gap: 12 } },
    h('div', { className: 'ar-header' }, h('div', { className: 'ar-header__brand' }, 'AR4 Console'), h(A.NavTabs, { defaultValue: 'pult', items: [
      { id: 'pult', label: 'Пульт' }, { id: 'cal', label: 'Калибровка', warn: 'не откалиброван' }, { id: 'axes', label: 'Оси' }, { id: 'log', label: 'Лог', count: 128 }] })),
    h('div', { className: 'ar-header' }, h('div', { className: 'ar-header__brand' }, 'AR4 Console'), h(A.NavTabs, { defaultValue: 'axes', items: [
      { id: 'pult', label: 'Пульт' }, { id: 'cal', label: 'Калибровка' }, { id: 'axes', label: 'Оси' }, { id: 'log', label: 'Лог' }] }))));
</script>
</body>
</html>
